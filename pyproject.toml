[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "forte-video-review"
version = "0.1.0"
description = "Local visual evidence review service for the ForteBank datathon"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "av==19.0.1",
  "fastapi==0.143.3",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pillow==13.0.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "python-multipart==0.0.32",
  "sqlalchemy==2.1.5",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
# GPU environments are separate from the CPU API/worker and the vLLM image.
# Python 3.12 on Linux is the intended training target; installation is not
# evidence of a working CUDA/model run.
training = [
  "accelerate==1.15.0; sys_platform == 'linux' and python_version == '3.12'",
  "peft==0.21.2; sys_platform == 'linux' and python_version == '3.12'",
  "torch==2.13.0+cu129; sys_platform == 'linux' and python_version == '3.12'",
  "torchvision==0.28.0+cu129; sys_platform == 'linux' and python_version == '3.12'",
  "transformers==5.17.0; sys_platform == 'linux' and python_version == '3.12'",
]

[dependency-groups]
dev = [
  "openpyxl==3.1.5",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
  "integration: synthetic cross-component checks",
  "gpu: requires an explicitly configured local GPU service",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux' and python_version == '3.12'" }]
torchvision = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux' and python_version == '3.12'" }]
