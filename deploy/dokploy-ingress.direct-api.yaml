# Dedicated frontend proxy plus public, secret-free direct-team-API bootstrap.
# Uses the original default HTTPS transport; no HTTP/1.1 experiment override.
services:
  edge:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp, /data, /config]
    environment:
      FORTE_EDGE_CADDYFILE: |
        {
          admin off
          log default {
            exclude http.log.error
          }
        }
        :80 {
          header {
            X-Content-Type-Options nosniff
            Referrer-Policy same-origin
          }
          handle /runtime-config.json {
            header Content-Type application/json
            header Cache-Control no-store
            respond `{"apiBaseUrl":"https://forte-review-wd88a7vvt.gobrev.dev"}` 200
          }
          handle {
            reverse_proxy https://forte-review-wd88a7vvt.gobrev.dev {
              header_up Host {upstream_hostport}
            }
          }
        }
    command:
      - /bin/sh
      - -ec
      - 'printf "%s\n" "$$FORTE_EDGE_CADDYFILE" > /tmp/Caddyfile; exec caddy run --config /tmp/Caddyfile --adapter caddyfile'
    expose: ["80"]
    networks: [dokploy-network]
    logging: {driver: none}
networks:
  dokploy-network:
    external: true
